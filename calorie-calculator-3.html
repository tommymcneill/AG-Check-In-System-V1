<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AG Calorie Calculator</title>

  <style>
    @font-face {
      font-family: 'Rajdhani';
      src: url('assets/fonts/Rajdhani-Light.ttf') format('truetype');
      font-weight: 300; font-style: normal; font-display: swap;
    }
    @font-face {
      font-family: 'Rajdhani';
      src: url('assets/fonts/Rajdhani-Regular.ttf') format('truetype');
      font-weight: 400; font-style: normal; font-display: swap;
    }
    @font-face {
      font-family: 'Rajdhani';
      src: url('assets/fonts/Rajdhani-Medium.ttf') format('truetype');
      font-weight: 500; font-style: normal; font-display: swap;
    }
    @font-face {
      font-family: 'Rajdhani';
      src: url('assets/fonts/Rajdhani-SemiBold.ttf') format('truetype');
      font-weight: 600; font-style: normal; font-display: swap;
    }
    @font-face {
      font-family: 'Rajdhani';
      src: url('assets/fonts/Rajdhani-Bold.ttf') format('truetype');
      font-weight: 700; font-style: normal; font-display: swap;
    }

    :root {
      --page-bg: #000000;
      --page-bg-end: #000000;
      --page-bg-accent: rgba(255, 212, 0, 0.10);
      --main-bg: #000000;
      --border: #222222;
      --panel: #111111;
      --text: #ffd400;
      --title: #ffffff;
      --link: #ffd400;
      --link-hover-bg: #1a1a1a;
      --main-heading: #ffffff;
      --toggle-bg: rgba(255, 255, 255, 0.08);
      --toggle-border: rgba(255, 255, 255, 0.14);
      --toggle-text: #ffffff;
      --toggle-shadow: rgba(0, 0, 0, 0.22);
    }

    body[data-theme='light'] {
      --page-bg: #f7f7f4;
      --page-bg-end: #ffffff;
      --page-bg-accent: rgba(255, 212, 0, 0.16);
      --main-bg: #ffffff;
      --border: #d8d5cb;
      --panel: #eceae4;
      --text: #111111;
      --title: #111111;
      --link: #111111;
      --link-hover-bg: rgba(0, 0, 0, 0.05);
      --main-heading: #111111;
      --toggle-bg: #fdfcf8;
      --toggle-border: rgba(0, 0, 0, 0.12);
      --toggle-text: #111111;
      --toggle-shadow: rgba(0, 0, 0, 0.10);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: 'Rajdhani', Arial, sans-serif;
      font-weight: 400;
      background:
        radial-gradient(circle at top, var(--page-bg-accent), transparent 35%),
        linear-gradient(180deg, var(--page-bg) 0%, var(--page-bg-end) 100%);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 60px 20px;
    }

    .theme-toggle {
      position: fixed;
      top: 16px; right: 16px;
      z-index: 20;
      width: 48px; height: 48px;
      border-radius: 999px;
      border: 1px solid var(--toggle-border);
      background: var(--toggle-bg);
      color: var(--toggle-text);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 12px 28px var(--toggle-shadow);
      backdrop-filter: blur(10px);
    }
    .theme-toggle svg { width: 22px; height: 22px; fill: currentColor; }
    .theme-toggle .sun-icon, .theme-toggle .moon-icon { display: none; }
    body[data-theme='dark'] .theme-toggle .sun-icon { display: block; }
    body[data-theme='light'] .theme-toggle .moon-icon { display: block; }

    .page {
      width: 100%;
      max-width: 600px;
    }

    .logo { width: 160px; display: block; margin: 0 auto 24px; }

    .back-link {
      display: inline-block;
      margin-bottom: 20px;
      padding: 9px 16px;
      font-size: 13px;
      font-weight: 600;
      color: var(--link);
      text-decoration: none;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 6px;
      transition: 0.2s;
    }
    .back-link:hover {
      background: var(--link-hover-bg);
      border-color: var(--text);
      transform: translateX(-2px);
    }

    h1 {
      font-size: 30px;
      margin: 0 0 6px;
      color: var(--main-heading);
      letter-spacing: 1px;
      font-weight: 700;
      text-align: center;
    }

    .subtitle {
      color: var(--text);
      font-size: 14px;
      opacity: 0.85;
      margin: 0 0 28px;
      font-weight: 400;
      text-align: center;
    }

    .content-box {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 28px;
    }

    .calc-form { display: flex; flex-direction: column; gap: 18px; }
    .calc-field label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 6px;
      color: var(--main-heading);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .calc-field select,
    .calc-field input[type="number"] {
      width: 100%;
      padding: 10px 12px;
      background: var(--page-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-family: 'Rajdhani', Arial, sans-serif;
      font-size: 15px;
      font-weight: 500;
    }
    .calc-weight-row {
      display: flex;
      gap: 10px;
    }
    .calc-weight-row input { flex: 1; }
    .calc-weight-row select { width: 90px; flex-shrink: 0; }
    .calc-checkbox {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      font-size: 14px;
      line-height: 1.4;
    }
    .calc-checkbox input { margin-top: 3px; accent-color: #ffd400; }
    .calc-button {
      margin-top: 4px;
      padding: 13px 20px;
      background: #ffd400;
      border: 1px solid #ffd400;
      color: #000000;
      font-weight: 700;
      border-radius: 6px;
      cursor: pointer;
      font-family: 'Rajdhani', Arial, sans-serif;
      font-size: 15px;
      letter-spacing: 0.5px;
      transition: 0.2s;
    }
    .calc-button:hover { background: #e6bf00; border-color: #e6bf00; }

    .calc-result {
      margin-top: 26px;
      padding-top: 22px;
      border-top: 1px solid var(--border);
      display: none;
    }
    .calc-result.show { display: block; }
    .calc-result .result-number {
      font-size: 38px;
      font-weight: 700;
      color: var(--main-heading);
      line-height: 1.1;
    }
    .calc-result .result-sub { font-size: 13px; opacity: 0.75; margin-top: 4px; }
    .calc-breakdown { margin-top: 18px; font-size: 13px; opacity: 0.85; line-height: 1.7; }
    .calc-note { font-size: 12px; opacity: 0.6; margin-top: 18px; font-style: italic; }
  </style>
</head>

<body>
  <button class="theme-toggle" id="themeToggle" type="button" aria-label="Toggle light mode" title="Toggle light mode">
    <svg class="sun-icon" viewBox="0 0 24 24" aria-hidden="true">
      <circle cx="12" cy="12" r="4.5" fill="currentColor"/>
      <line x1="12" y1="2.5" x2="12" y2="5.2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      <line x1="12" y1="18.8" x2="12" y2="21.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      <line x1="2.5" y1="12" x2="5.2" y2="12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      <line x1="18.8" y1="12" x2="21.5" y2="12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      <line x1="5.2" y1="5.2" x2="7.1" y2="7.1" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      <line x1="16.9" y1="16.9" x2="18.8" y2="18.8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      <line x1="5.2" y1="18.8" x2="7.1" y2="16.9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      <line x1="16.9" y1="7.1" x2="18.8" y2="5.2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
    </svg>
    <svg class="moon-icon" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M21 14.2A9 9 0 0 1 9.8 3a1 1 0 0 0-1.2 1.2A8 8 0 1 0 19.8 15.4a1 1 0 0 0 1.2-1.2Z"/>
    </svg>
  </button>

  <div class="page">
    <img src="assets/images/ag-logo.png" alt="AG Logo" class="logo">
    <a href="programs.html" class="back-link">&larr; Back to Menu</a>

    <h1>Calorie Calculator</h1>
    <p class="subtitle">Get a baseline daily calorie target based on goal, height, and body type</p>

    <div class="content-box">
      <div class="calc-form">

        <div class="calc-field">
          <label for="calcGoal">Goal</label>
          <select id="calcGoal"></select>
        </div>

        <div class="calc-field">
          <label for="calcHeight">Height</label>
          <select id="calcHeight"></select>
        </div>

        <div class="calc-field">
          <label for="calcSex">Sex</label>
          <select id="calcSex">
            <option value="male">Male</option>
            <option value="female">Female</option>
          </select>
        </div>

        <div class="calc-field">
          <label for="calcWeight">Bodyweight</label>
          <div class="calc-weight-row">
            <input type="number" id="calcWeight" min="1" step="0.1" placeholder="e.g. 161">
            <select id="calcWeightUnit">
              <option value="lbs" selected>lbs</option>
              <option value="kg">kg</option>
            </select>
          </div>
        </div>

        <div class="calc-field">
          <label for="calcFrame">Body Frame</label>
          <select id="calcFrame">
            <option value="-50">Smaller frame / smaller bones (-50 cal)</option>
            <option value="0" selected>Average frame (no adjustment)</option>
            <option value="50">Bigger frame / bigger bones (+50 cal)</option>
          </select>
        </div>

        <label class="calc-checkbox">
          <input type="checkbox" id="calcJob">
          <span>I have a physically demanding job (manual labor 5–6 days/week, 20,000+ steps 5–6 days/week, or on my feet/stairs all day) — adds +200 cal</span>
        </label>

        <button class="calc-button" id="calcButton" type="button">Calculate</button>

        <div class="calc-result" id="calcResult">
          <div class="result-number" id="calcResultNumber">0 calories</div>
          <div class="result-sub" id="calcResultSub"></div>
          <div class="calc-breakdown" id="calcBreakdown"></div>
        </div>

        <p class="calc-note">This gives a rough starting calorie target based on your goal, height, sex, and body type. Adjust over time based on real-world results.</p>
      </div>
    </div>
  </div>

  <script>
    const themeToggle = document.getElementById('themeToggle');
    const themePreferenceKey = 'ag-check-in-theme';

    function applyTheme(theme) {
      document.body.setAttribute('data-theme', theme);
      themeToggle.setAttribute('aria-label', theme === 'dark' ? 'Toggle light mode' : 'Toggle dark mode');
      themeToggle.setAttribute('title', theme === 'dark' ? 'Toggle light mode' : 'Toggle dark mode');
      localStorage.setItem(themePreferenceKey, theme);
    }
    function getStoredTheme() {
      const s = localStorage.getItem(themePreferenceKey);
      if (s === 'light' || s === 'dark') return s;
      return window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
    }
    themeToggle.addEventListener('click', () => {
      const current = document.body.getAttribute('data-theme') || 'dark';
      applyTheme(current === 'dark' ? 'light' : 'dark');
    });
    applyTheme(getStoredTheme());

    // ===== CALORIE CALCULATOR =====
    const goalOptions = [
      { value: 10, label: '10 — Moderate Weight Loss' },
      { value: 11, label: '11 — Moderate Weight Loss' },
      { value: 12, label: '12 — Mild Weight Loss' },
      { value: 13, label: '13 — Maintenance' },
      { value: 14, label: '14 — Maintenance' },
      { value: 15, label: '15 — Maintenance' },
      { value: 16, label: '16 — Moderate Weight Gain' },
      { value: 17, label: '17 — Moderate Weight Gain' },
      { value: 18, label: '18 — Moderate Weight Gain' },
    ];

    // Height adjustment table. 5'11" and 5'10" were not present in the
    // source table — values are linearly interpolated between 6'0 (0)
    // and 5'9 (-1.00) and flagged as estimated. Confirm/replace if you
    // have the real figures.
    const heightOptions = [
      { label: "6'4\"", adj: 0.20 },
      { label: "6'3\"", adj: 0.15 },
      { label: "6'2\"", adj: 0.10 },
      { label: "6'1\"", adj: 0.05 },
      { label: "6'0\"", adj: 0.00 },
      { label: "5'11\" (estimated)", adj: -0.33 },
      { label: "5'10\" (estimated)", adj: -0.67 },
      { label: "5'9\"", adj: -1.00 },
      { label: "5'8\"", adj: -1.06 },
      { label: "5'7\"", adj: -1.09 },
      { label: "5'6\"", adj: -1.12 },
      { label: "5'5\"", adj: -1.15 },
      { label: "5'4\"", adj: -1.18 },
      { label: "5'3\"", adj: -1.21 },
      { label: "5'2\"", adj: -1.24 },
      { label: "5'1\"", adj: -1.27 },
      { label: "5'0\"", adj: -1.30 },
    ];

    const calcGoalSelect = document.getElementById('calcGoal');
    const calcHeightSelect = document.getElementById('calcHeight');

    goalOptions.forEach((g) => {
      const opt = document.createElement('option');
      opt.value = g.value;
      opt.textContent = g.label;
      if (g.value === 12) opt.selected = true;
      calcGoalSelect.appendChild(opt);
    });

    heightOptions.forEach((h) => {
      const opt = document.createElement('option');
      opt.value = h.adj;
      opt.textContent = h.label;
      if (h.label.startsWith("5'9")) opt.selected = true;
      calcHeightSelect.appendChild(opt);
    });

    const calcWeightInput = document.getElementById('calcWeight');
    const calcWeightUnit = document.getElementById('calcWeightUnit');

    calcWeightUnit.addEventListener('change', () => {
      calcWeightInput.placeholder = calcWeightUnit.value === 'kg' ? 'e.g. 73' : 'e.g. 161';
    });

    document.getElementById('calcButton').addEventListener('click', () => {
      const goal = parseFloat(calcGoalSelect.value);
      const heightAdj = parseFloat(calcHeightSelect.value);
      const sex = document.getElementById('calcSex').value;
      const weightInput = parseFloat(calcWeightInput.value);
      const unit = calcWeightUnit.value;
      // 1 kg = 2.20462 lbs — convert to lbs since the formula is built on lbs
      const weight = unit === 'kg' ? weightInput * 2.20462 : weightInput;
      const frameAdj = parseFloat(document.getElementById('calcFrame').value);
      const jobAdj = document.getElementById('calcJob').checked ? 200 : 0;

      const resultBox = document.getElementById('calcResult');
      const resultNumber = document.getElementById('calcResultNumber');
      const resultSub = document.getElementById('calcResultSub');
      const breakdown = document.getElementById('calcBreakdown');

      if (!weightInput || weightInput <= 0) {
        resultBox.classList.add('show');
        resultNumber.textContent = 'Enter your bodyweight';
        resultSub.textContent = '';
        breakdown.innerHTML = '';
        return;
      }

      const runningNumber = goal + heightAdj;
      let calories = runningNumber * weight;
      const beforeExtras = calories;

      calories += frameAdj;
      calories += jobAdj;

      const femaleAdj = sex === 'female' ? -100 : 0;
      calories += femaleAdj;

      const globalAdj = 150;
      calories += globalAdj;

      const rounded = Math.round(calories / 50) * 50;

      resultBox.classList.add('show');
      resultNumber.textContent = `${Math.round(rounded).toLocaleString()} calories/day`;
      resultSub.textContent = `(unrounded: ${Math.round(calories).toLocaleString()} calories/day)`;

      breakdown.innerHTML = `
        ${unit === 'kg' ? `Bodyweight: ${weightInput} kg → ${weight.toFixed(1)} lbs<br>` : ''}
        Goal number: ${goal} ${heightAdj >= 0 ? '+' : ''}${heightAdj.toFixed(2)} (height) = ${runningNumber.toFixed(2)}<br>
        ${runningNumber.toFixed(2)} × ${weight.toFixed(1)} lbs = ${Math.round(beforeExtras).toLocaleString()} calories<br>
        ${frameAdj !== 0 ? `Body frame adjustment: ${frameAdj > 0 ? '+' : ''}${frameAdj} calories<br>` : ''}
        ${jobAdj !== 0 ? `Physically demanding job: +${jobAdj} calories<br>` : ''}
        ${femaleAdj !== 0 ? `Female adjustment: ${femaleAdj} calories<br>` : ''}
        Safety adjustment: +${globalAdj} calories<br>
        Rounded to nearest 50: <strong>${Math.round(rounded).toLocaleString()} calories/day</strong>
      `;
    });
  </script>
</body>
</html>
